services:
  # 1. Next.js 14 Web Cinema Frontend (Free Web Service)
  - type: web
    name: watchparty-web
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm --workspace=@watchparty/shared run build && npm --workspace=@watchparty/web run build
    startCommand: npm --workspace=@watchparty/web run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: watchparty-server
          property: host

  # 2. Node.js API, Socket.IO & Transcoding Engine (Free Web Service)
  - type: web
    name: watchparty-server
    env: docker
    dockerfilePath: apps/server/Dockerfile
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: RUN_EMBEDDED_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: watchparty-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: web
          name: watchparty-web
          property: host

databases:
  # Cloud Managed PostgreSQL 16 (Free Tier)
  - name: watchparty-db
    databaseName: watchparty
    user: watchparty_user
    plan: free
